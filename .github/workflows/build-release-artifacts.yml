name: Build release artifacts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Server typecheck
        run: bun run --filter @omo/server typecheck
      - name: Bridge typecheck
        run: bun run --filter @omo/telemetry-bridge typecheck
      - name: Focused config tests
        run: bun test apps/server/src/config.test.ts apps/server/src/release-web.test.ts

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: windows-2022
            target: bun-windows-x64
            platform: windows-x64
            artifact: owl-windows-x64
          - runs-on: macos-14
            target: bun-darwin-arm64
            platform: darwin-arm64
            artifact: owl-darwin-arm64
          - runs-on: ubuntu-22.04
            target: bun-linux-x64-baseline
            platform: linux-x64
            artifact: owl-linux-x64
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Prepare release
        run: bun run scripts/prepare-release.ts --target ${{ matrix.target }} --out "${{ runner.temp }}/owl-release-${{ matrix.platform }}"
      - name: Smoke release
        run: bun run scripts/smoke-release.ts --dir "${{ runner.temp }}/owl-release-${{ matrix.platform }}"
      - name: Upload release artifact and checksum
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ runner.temp }}/owl-v*-${{ matrix.platform }}.*
          retention-days: 14
          if-no-files-found: error
          compression-level: 0
