name: Desktop release

# Builds the Tauri desktop apps and publishes a DRAFT GitHub release with:
#   - macOS ARM64 .app + .dmg        (macos-14)
#   - Windows x64 NSIS setup .exe    (windows-2022)
#   - Linux x64 .deb + .AppImage     (ubuntu-22.04)
# The bundled Bun sidecar is compiled per target, smoke-tested in desktop
# mode, and no CLI tar.gz release archives are produced anymore.
# The release stays a draft until a maintainer publishes it.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create/update (draft)"
        required: true
        default: "v0.1.0"
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Server typecheck
        run: bun run --filter @omo/server typecheck
      - name: Bridge typecheck
        run: bun run --filter @omo/telemetry-bridge typecheck
      - name: Focused config tests
        run: bun test apps/server/src/config.test.ts apps/server/src/release-web.test.ts

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: darwin-arm64
            platform: macos
            bundles: "app,dmg"
            artifact: owl-desktop-macos-arm64
          - runner: windows-2022
            target: windows-x64
            platform: windows
            bundles: "nsis"
            artifact: owl-desktop-windows-x64
          - runner: ubuntu-22.04
            target: linux-x64
            platform: linux
            bundles: "deb,appimage"
            artifact: owl-desktop-linux-x64
    runs-on: ${{ matrix.runner }}
    env:
      # linuxdeploy (AppImage) needs FUSE, which GitHub-hosted Ubuntu runners
      # lack; extract-and-run makes the AppImage runtime self-extract instead.
      # NO_STRIP skips linuxdeploy's strip step, which can fail on the
      # Bun-compiled sidecar (not a standard ELF). Both are inert on macOS/Windows.
      APPIMAGE_EXTRACT_AND_RUN: "1"
      NO_STRIP: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Linux Tauri prerequisites
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2 \
            libglib2.0-bin \
            libgdk-pixbuf2.0-bin \
            libgtk-3-bin \
            desktop-file-utils \
            shared-mime-info \
            squashfs-tools \
            xdg-utils
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Prepare desktop assets and compile target sidecar
        run: bun run scripts/prepare-desktop-assets.ts --target ${{ matrix.target }}
      - name: Smoke sidecar (desktop mode)
        run: bun run scripts/smoke-sidecar.ts
      - name: Wrap ldd for static Bun sidecar
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          # linuxdeploy-plugin-gtk runs `ldd` on the bundled externalBin. The
          # Bun-compiled sidecar is a musl-static binary, so ldd reports "not a
          # dynamic executable" and the plugin aborts. Wrap /usr/bin/ldd so that
          # only the staged sidecar basename `owl` is reported as statically
          # linked; every other invocation is delegated unchanged to the real ldd.
          if [ ! -e /usr/bin/ldd.real ]; then
            sudo mv /usr/bin/ldd /usr/bin/ldd.real
          fi
          sudo tee /usr/bin/ldd >/dev/null <<'LDD_WRAPPER'
          #!/usr/bin/env bash
          set -euo pipefail
          target=""
          for arg in "$@"; do
            case "$arg" in
              -*) ;;
              *) target="$arg"; break ;;
            esac
          done
          if [ -n "$target" ] && [ "$(basename "$target")" = "owl" ]; then
            echo "	statically linked"
            exit 0
          fi
          exec /usr/bin/ldd.real "$@"
          LDD_WRAPPER
          sudo chmod +x /usr/bin/ldd
          echo "ldd wrapper installed; real ldd at /usr/bin/ldd.real"
      - name: Build Tauri bundles
        uses: tauri-apps/tauri-action@v0
        with:
          # --verbose surfaces linuxdeploy stderr in the action log if AppImage
          # bundling fails again, instead of the bare "failed to run linuxdeploy".
          args: --ci --verbose --bundles ${{ matrix.bundles }}
      - name: Verify bundle layout
        run: bun run scripts/verify-desktop-bundle.ts --platform ${{ matrix.platform }}
      - name: Collect installer assets
        shell: bash
        run: |
          set -euo pipefail
          out="${{ runner.temp }}/release-assets"
          mkdir -p "$out"
          b="src-tauri/target/release/bundle"
          case "${{ matrix.platform }}" in
            macos)
              cp "$b"/dmg/*.dmg "$out"/
              ditto -c -k --sequesterRsrc --keepParent "$b/macos/Owl.app" "$out/Owl_aarch64.app.zip"
              ;;
            windows)
              cp "$b"/nsis/*.exe "$out"/
              ;;
            linux)
              cp "$b"/deb/*.deb "$out"/
              cp "$b"/appimage/*.AppImage "$out"/
              ;;
          esac
          ls -la "$out"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ runner.temp }}/release-assets/*
          if-no-files-found: error
          compression-level: 0

  release:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        with:
          pattern: owl-desktop-*
          path: assets
          merge-multiple: true
      - name: Checksums
        run: |
          cd assets
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          draft: true
          generate_release_notes: true
          files: assets/*
