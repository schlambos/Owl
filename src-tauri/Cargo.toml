[package]
name = "owl-desktop"
version = "0.1.3",
description = "Owl desktop — local control plane for OpenCode and OMO-Slim"
license = "Apache-2.0"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.9"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
